defaults:
  - base
  - _self_
model_id : /.../Qwen2.5-VL-7B-Instruct
module_name: models.qwen
class_name: Qwen2_5VL
max_new_tokens: 1024
system_prompt: >
  You are a document query-answering assistant. Your task is to answer the query based on the documents below. 
  You should only return the final answer and reason in this dictionary format: {"Answer": <Your final answer here>, "reason":<Your reason here>}. Don't give other information.
user_message: >
  Each document is in the format: [index] : {{document}}, where {{document}} is the content of that page.
  Given the query: "{question}", the reason : "{reason}" and the following documents:

train_prompt: |
  You are responsible for evaluating a list of answers generated by a model. Given a question, a standard answer, and a list of model-generated answers, your task is to assign a similarity score to each model answer by comparing it with the standard answer. Each score should be a float between 0 and 1, where a higher score means higher similarity.
  Only return the result in strict JSON format. Do not include any explanation, comments, markdown, or extra symbols.
  The output format must be exactly like this: {{"score": [0.75, 0.3, 1.0]}}
  Do not include anything else in your response.
  Question: {question}  
  Standard answer: {gt}  
  Model answers: {answer}

   
